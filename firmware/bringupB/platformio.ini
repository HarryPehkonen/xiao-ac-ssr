; bringupB — drive GATE_DRV (XIAO D1 = GPIO3) so BRINGUP section B can be measured with a DMM.
;
; No libraries, no radio, no credentials: the WiFi/BT stack is deliberately left off so the
; ~12 mA LED current does not jitter under transmit bursts while you are reading it.
;
;   pio run -t upload          flash it
;   pio device monitor         serial console (s = status, 1 = on, 0 = off, b = blink)
;
; See README.md for the pin map and the expected meter readings.

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; Native USB on the C3: Serial is the USB Serial/JTAG.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
